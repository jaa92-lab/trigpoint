name: News check

# Runs one live web news search with the stored OpenRouter key and prints what came
# back. Posts nothing to Metaculus, and costs a few cents of model credit.
on:
  workflow_dispatch:
    inputs:
      query:
        description: What to search for
        default: Texas prison air-conditioning injunction appeal
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Search
        run: uv run --no-sync python -m forecaster.evidence.web_news "$QUERY"
        env:
          QUERY: ${{ inputs.query }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
